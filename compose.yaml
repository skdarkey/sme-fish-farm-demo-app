services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fishfarm
      POSTGRES_USER: fishfarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - farm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishfarm -d fishfarm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  farm_data:
